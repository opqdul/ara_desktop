name: Legacy Flutter Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "macos/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".env"
      - "scripts/build_macos.sh"
      - ".github/workflows/legacy-flutter.yml"

permissions:
  contents: read

jobs:
  macos:
    name: macOS (legacy Flutter)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Build macOS PKG and DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacy-macos-flutter
          path: |
            build/macos/*.pkg
            build/macos/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (legacy Flutter, diagnostic)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zip

      - name: Generate Linux runner
        run: flutter create --platforms=linux .

      - name: Build Linux app (legacy Flutter)
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          flutter build linux --release 2>&1 | tee linux-build.log

      - name: Package Linux bundle
        if: success()
        run: |
          cd build/linux/x64/release
          zip -r "$GITHUB_WORKSPACE/legacy-linux-flutter.zip" bundle

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-linux-flutter-diagnostics
          path: |
            linux-build.log
            legacy-linux-flutter.zip
            build/linux
          if-no-files-found: warn

  release:
    name: Legacy prerelease
    runs-on: ubuntu-latest
    needs:
      - macos
      - linux
    if: always() && github.ref == 'refs/heads/main' && needs.macos.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: legacy-macos-flutter
          path: release/macos

      - name: Download Linux diagnostics
        uses: actions/download-artifact@v4
        with:
          name: legacy-linux-flutter-diagnostics
          path: release/linux

      - name: Publish legacy prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-flutter
          name: Legacy Flutter Reference Builds
          body: |
            Legacy Flutter reference builds. Do not use these as production installers.

            - macOS: original Flutter app PKG/DMG.
            - Linux: original Flutter app bundle; it compiles, but has no Linux webview backend and is non-functional.
            - Production client: native Windows v2.0.0 — https://github.com/opqdul/ara_desktop/releases/tag/v2.0.0

            ... but better.
          files: |
            release/macos/*.pkg
            release/macos/*.dmg
            release/linux/linux-build.log
            release/linux/legacy-linux-flutter.zip
          fail_on_unmatched_files: false
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
